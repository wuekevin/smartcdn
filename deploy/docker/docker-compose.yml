version: "3.9"

# SmartCDN — Docker Compose multi-service deployment
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d

services:

  # ── SmartCDN server ────────────────────────────────────────────────────────
  smartcdn:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: smartcdn:latest
    container_name: smartcdn
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SMARTCDN_ENCRYPT_KEY: "${SMARTCDN_ENCRYPT_KEY}"
      DB_DSN: "${DB_DSN:-smartcdn:smartcdn@tcp(mysql:3306)/smartcdn?charset=utf8mb4&parseTime=True&loc=Local}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/install.lock:/app/install.lock:rw
      - ./data/certs:/app/certs:ro
    networks:
      - smartcdn

  # ── MySQL 8 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smartcdn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpassword}"
      MYSQL_DATABASE: "smartcdn"
      MYSQL_USER: "smartcdn"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-smartcdn}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartcdn

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartcdn-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smartcdn

  # ── goose migration runner (runs once and exits) ───────────────────────────
  migrate:
    image: smartcdn:latest
    container_name: smartcdn-migrate
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache go && \
        go install github.com/pressly/goose/v3/cmd/goose@latest && \
        goose -dir /app/migrations mysql "$DB_DSN" up
    environment:
      DB_DSN: "${DB_DSN:-smartcdn:smartcdn@tcp(mysql:3306)/smartcdn?charset=utf8mb4&parseTime=True&loc=Local}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartcdn
    profiles:
      - migrate

volumes:
  mysql_data:
  redis_data:

networks:
  smartcdn:
    driver: bridge
